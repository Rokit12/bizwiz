<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Bigwiz business platform: POS, inventory, LPOs, invoices, finance, VAT, eTIMS, payroll, hotel and fleet."><meta name="theme-color" content="#15211c"><link rel="apple-touch-icon" href="icon.png"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style><script>window.BIGWIZ_WEB=true</script></head><body><title>Bigwiz</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='13' fill='%2315211c'/><rect x='9' y='9' width='46' height='46' rx='9' fill='%23c08a12'/><text x='32' y='44' font-family='Arial' font-weight='700' font-size='32' text-anchor='middle' fill='%231a1405'>B</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: a ledger-like workbench. Fixed module rail on the left, module header with workstream tag + tabs, then KPI strip and working panels. */
:root{
  --bg:#f2f4f1; --surface:#ffffff; --surface-2:#e8ede9; --line:#d4dcd6; --ink:#15211c; --muted:#5a6b62;
  --accent:#24584a; --accent-ink:#ffffff; --accent-soft:#dcebe5; --gold:#c08a12; --gold-soft:#f6ecd2;
  --ok:#2b7a4b; --ok-soft:#dff0e5; --warn:#a96a0c; --warn-soft:#f7ead2; --bad:#b83a26; --bad-soft:#f8e0db; --info:#2f5f9e; --info-soft:#dfe8f5;
  --rail:#15211c; --rail-ink:#d7e2dc; --rail-muted:#8fa399; --rail-active:#24584a;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --surface:#161f1b; --surface-2:#1e2924; --line:#2b3832; --ink:#e3ebe6; --muted:#93a59b;
  --accent:#7cc2a9; --accent-ink:#0f1513; --accent-soft:#1f3a31; --gold:#e3ad45; --gold-soft:#3a2f17;
  --ok:#6fcf97; --ok-soft:#1c3427; --warn:#e7b05a; --warn-soft:#3a2d17; --bad:#f08a76; --bad-soft:#3d221d; --info:#86b2ea; --info-soft:#1c2b40;
  --rail:#0a0f0d; --rail-ink:#d7e2dc; --rail-muted:#7f9389; --rail-active:#1f3a31; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513; --surface:#161f1b; --surface-2:#1e2924; --line:#2b3832; --ink:#e3ebe6; --muted:#93a59b;
  --accent:#7cc2a9; --accent-ink:#0f1513; --accent-soft:#1f3a31; --gold:#e3ad45; --gold-soft:#3a2f17;
  --ok:#6fcf97; --ok-soft:#1c3427; --warn:#e7b05a; --warn-soft:#3a2d17; --bad:#f08a76; --bad-soft:#3d221d; --info:#86b2ea; --info-soft:#1c2b40;
  --rail:#0a0f0d; --rail-ink:#d7e2dc; --rail-muted:#7f9389; --rail-active:#1f3a31; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
.side{background:var(--rail);color:var(--rail-ink);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;padding-block:18px}
.brand{display:flex;align-items:center;gap:10px;padding:0 18px 18px}
.mark{width:32px;height:32px;border-radius:7px;background:var(--gold);color:#1a1405;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px}
.brand b{font-family:var(--display);font-size:21px;letter-spacing:-.02em}
.brand .bname{font-size:17px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.blogo{width:36px;height:36px;object-fit:contain;background:#fff;border-radius:7px;padding:2px;flex:none}
.logobox{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line)}
.logobox .prev{width:120px;height:64px;border:1px dashed var(--line);border-radius:8px;display:grid;place-items:center;background:#fff;overflow:hidden}
.logobox .prev img{max-width:112px;max-height:56px}
.swatch{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:6px;border:1px solid var(--line)}
.brand small{display:block;color:var(--rail-muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px;padding:0 10px}
.navg{color:var(--rail-muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;padding:14px 10px 6px}
.navi{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:8px 10px;border-radius:6px;color:var(--rail-ink);text-decoration:none;font-size:13.5px}
.navi:hover{background:rgba(255,255,255,.06)}
.navi.on{background:var(--rail-active);color:#fff}
.navi .ws{font-family:var(--mono);font-size:10.5px;color:var(--rail-muted)}
.navi .badge{background:var(--gold);color:#1a1405;border-radius:10px;font-size:11px;padding:0 6px;font-weight:600}
.sidefoot{margin-top:auto;padding:16px 18px 0;font-size:12px;color:var(--rail-muted);display:flex;flex-direction:column;gap:8px}
.sidefoot button{background:none;border:1px solid #33433b;color:var(--rail-ink);border-radius:6px;padding:6px 10px;cursor:pointer;text-align:left}

main{min-width:0;padding-inline:28px;padding-block:22px 60px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.top h1{font-size:28px;margin-top:2px}
.topr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.who{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px;background:none;border:1px solid transparent;border-radius:8px;padding:4px 8px;cursor:pointer}
.who:hover{border-color:var(--line)}
.robar{margin-top:12px;background:var(--info-soft);color:var(--info);border-radius:8px;padding:8px 12px;font-size:13px}
table.perm td{padding:7px 12px}table.perm tr.pm td{background:var(--surface-2);border-top:1px solid var(--line)}table.perm tr.pt td:first-child{padding-left:32px;color:var(--muted)}table.perm select{padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);min-width:210px}
button:disabled[data-act]{cursor:not-allowed}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:12px}
.bell{position:relative}
.bell i{position:absolute;top:-4px;right:-4px;background:var(--bad);color:#fff;font-style:normal;font-size:10px;border-radius:9px;padding:0 5px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:16px 0 20px;overflow-x:auto}
.tab{background:none;border:0;padding:9px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.tabs.wrap{flex-wrap:wrap;border-bottom:0;gap:6px;overflow:visible}
.tabs.wrap .tab{border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:12.5px;background:var(--surface)}
.tabs.wrap .tab.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.pbar label{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.pbar input,.pbar select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.stmt table td:first-child{padding-left:16px}
.stmt tr.tt td{font-weight:600;border-top:1px solid var(--line)}
.mdl.wide{width:min(980px,100%)}
.lines.lpo .lr,.lines.lpo .lh{display:grid;grid-template-columns:minmax(150px,1fr) 70px 140px 95px 64px 96px 28px;gap:8px;margin-bottom:6px;align-items:center}
.lines.lpo .lr select,.lines.lpo .lr input{padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);min-width:0;width:100%}
.lines.lpo .lt{text-align:right;font-size:13px}
.lines.lpo .lh .r{text-align:right}
.lpotot{min-width:240px;margin-left:auto}
.lines.jl .lr,.lines.jl .lh{grid-template-columns:minmax(0,1fr) 100px 100px 30px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:20px;font-weight:500;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;margin-top:2px;color:var(--muted)}
.kpi .s.bad{color:var(--bad)} .kpi .s.ok{color:var(--ok)} .kpi .s.warn{color:var(--warn)}

.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:2fr 1fr}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ph h3{font-size:15.5px}
.ph .acts{display:flex;gap:6px;flex-wrap:wrap}
.pb{padding:14px 16px}
.pb.flush{padding:0}

.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-weight:500;color:var(--muted);text-align:left;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
.r{text-align:right}
td.num{white-space:nowrap}
td .sub{display:block;font-size:11.5px;color:var(--muted)}
tfoot td{font-weight:600;border-top:2px solid var(--line)}
.rowacts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}

.pill{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:20px;font-weight:500;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--info-soft);color:var(--info)}
.pill.acc{background:var(--accent-soft);color:var(--accent)} .pill.gold{background:var(--gold-soft);color:var(--warn)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}

.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);padding:10px 16px;border-top:1px solid var(--line)}
.callout{background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);border-radius:var(--r);padding:10px 14px;font-size:13px;margin-bottom:16px}

/* POS */
.pos{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:16px;align-items:start}
.search{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:4px 10px;font-size:12px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pcard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:96px}
.pcard:hover{border-color:var(--accent)}
.pcard .nm{font-weight:600;font-size:13px;line-height:1.25}
.pcard .meta{font-size:11.5px;color:var(--muted)}
.pcard .pr{font-family:var(--mono);margin-top:auto;font-weight:500}
.pcard:disabled{opacity:.5}
.cart{position:sticky;top:12px}
.cl{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:24px;height:24px;border-radius:5px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(60px,1fr));gap:4px;background:var(--surface-2);padding:3px;border-radius:7px}
.seg button{border:0;background:transparent;padding:7px 4px;border-radius:5px;cursor:pointer;font-size:12.5px;font-weight:500}
.seg button.on{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tot{display:flex;justify-content:space-between;padding:3px 0;font-size:13px}
.tot.big{font-size:18px;font-weight:600;font-family:var(--display);padding-top:8px;border-top:1px solid var(--line);margin-top:6px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:12px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);width:100%;min-width:0}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* Hotel */
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.room{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:6px;border-top:4px solid var(--line)}
.room.occ{border-top-color:var(--info)} .room.vac{border-top-color:var(--ok)} .room.dirty{border-top-color:var(--warn)} .room.ooo{border-top-color:var(--bad)}
.room .no{font-family:var(--display);font-size:22px;font-weight:700}
.room .ty{font-size:12px;color:var(--muted)}

/* Kanban */
.kan{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface-2);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:180px}
.col h4{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:10px;display:flex;flex-direction:column;gap:4px;font-size:13px}

/* Recs */
.recs{display:flex;flex-direction:column}
.rec{display:grid;grid-template-columns:6px 1fr auto;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line);align-items:center}
.rec:last-child{border-bottom:0}
.sev{align-self:stretch;border-radius:3px;background:var(--line)}
.sev.bad{background:var(--bad)} .sev.warn{background:var(--warn)} .sev.info{background:var(--info)} .sev.ok{background:var(--ok)}
.rec b{display:block;font-weight:600}
.rec .d{font-size:12.5px;color:var(--muted)}
.rec .m{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}

/* Charts */
svg.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--mono);font-size:10px}
.chart .grid line{stroke:var(--line)}
.chart .bar{fill:var(--accent)}
.chart .bar.hot{fill:var(--gold)}
.chart .bar2{fill:var(--gold)}
.hb{display:flex;flex-direction:column;gap:9px}
.hbr{display:grid;grid-template-columns:minmax(0,140px) 1fr auto;gap:10px;align-items:center;font-size:12.5px}
.hbr .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbr .track{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.hbr .fill{height:100%;background:var(--accent);border-radius:5px}
.hbr .v{font-family:var(--mono);font-size:12px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.check{display:flex;gap:10px;align-items:flex-start;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.check input{margin-top:3px;accent-color:var(--accent)}
.check.done span{color:var(--muted);text-decoration:line-through}
.meter{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.toggle{position:relative;width:38px;height:22px;border-radius:11px;background:var(--line);border:0;cursor:pointer;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.toggle.on{background:var(--accent)} .toggle.on::after{left:19px}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow .d{font-size:12.5px;color:var(--muted)}
.matrix td,.matrix th{text-align:center} .matrix td:first-child,.matrix th:first-child{text-align:left}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--accent)}
.dot.no{background:transparent;border:1px solid var(--line)}
.dot.ro{background:var(--gold)}

/* Modal */
.ov{position:fixed;inset:0;background:rgba(10,16,13,.5);display:grid;place-items:center;padding:16px;z-index:50}
.mdl{background:var(--surface);border-radius:10px;width:min(620px,100%);max-height:calc(100% - 24px);overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.mdl header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.mdl header h2{font-size:18px}
.mdl .x{border:0;background:none;font-size:20px;cursor:pointer;color:var(--muted)}
#mbody{padding:16px 18px}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.ferr{color:var(--bad);font-size:13px;margin:8px 0 0}
.lines .lr,.lines .lh{display:grid;grid-template-columns:1fr 90px 30px;gap:8px;margin-bottom:6px}
.lines.cost .lr,.lines.cost .lh{grid-template-columns:minmax(0,1fr) 70px 110px 30px}
.lines .lh{font-size:11.5px;color:var(--muted);margin-bottom:4px}
.posbar{display:flex;gap:8px;flex-wrap:wrap}.posbar .search{flex:1;min-width:200px;width:auto}
.lines .lr select,.lines .lr input{padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);min-width:0}
.lines .lr button{border:1px solid var(--line);background:var(--surface);border-radius:6px;cursor:pointer}
.rcpt{font-family:var(--mono);font-size:12.5px;background:var(--surface-2);padding:14px;border-radius:8px}
.rcpt .rl{display:flex;justify-content:space-between;gap:10px}
.rcpt hr{border:0;border-top:1px dashed var(--line);margin:8px 0}
dl.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;margin:0;font-size:13px}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0;text-align:right}dl.kv dd.num{white-space:nowrap}

<script>
/* ============ Utilities ============ */
const pad=(n,w=4)=>String(n).padStart(w,'0');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function addDays(s,n){const d=new Date(s+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}

const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
const pick=a=>a[Math.floor(rnd()*a.length)];

function sig16(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<16;i++)s+=c[Math.floor(rnd()*c.length)];return s.replace(/(.{4})(?!$)/g,'$1-')}
function code10(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ0123456789';let s='T';for(let i=0;i<9;i++)s+=c[Math.floor(rnd()*c.length)];return s}

/* ============ Chart of accounts ============ */
const BASE_ACCTS=[
 ['1000','Cash on hand','A','cash'],['1010','M-Pesa till','A','mpesa'],['1020','KCB Bank – current account','A','bank'],['1025','Equity Bank – collections','A','bank'],['1030','Petty cash','A','petty'],['1100','Accounts receivable','A','control'],['1200','Inventory','A','control'],['1300','VAT input','A','vat'],
 ['2000','Accounts payable','L','control'],['2100','PAYE payable','L'],['2110','NSSF payable','L'],['2120','SHIF payable','L'],['2130','Housing levy payable','L'],['2200','VAT output','L','vat'],['2210','VAT payable to KRA','L','vat'],
 ['3000',"Owner's capital",'E'],['3100',"Owner's drawings",'E'],
 ['4000','Sales – goods','I'],['4050','Sales returns & credit notes','I'],['4100','Hotel room revenue','I'],['4200','Other income','I'],
 ['5000','Cost of goods sold','X'],['6000','Salaries & wages','X'],['6010','Employer statutory contributions','X'],['6100','Fuel','X'],['6110','Vehicle maintenance','X'],['6200','Rent','X'],['6300','Electricity','X'],['6310','Water','X'],['6320','Internet & telephone','X'],['6400','Stock losses & write-offs','X'],['6410','Cash over / short','X'],['6420','Stationery & office','X'],['6430','Cleaning & sanitation','X'],['6440','Staff meals & refreshments','X'],['6500','Bank charges','X'],['6900','Other expenses','X']];

/* ============ State ============ */

let S;
const DESK=(location.protocol==='http:'&&location.hostname==='127.0.0.1')?{token:new URLSearchParams(location.search).get('t')||''}:null;
function api(path,opts={}){return fetch(path,{...opts,headers:{'X-Bigwiz-Token':DESK.token,...(opts.headers||{})}}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r})}
let deskBusy=false,deskDirty=false;
function deskSave(){if(deskBusy){deskDirty=true;return}deskBusy=true;deskDirty=false;api('/api/data',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(S)}).catch(()=>toast('Could not save to disk. Check that Bigwiz is still running.')).finally(()=>{deskBusy=false;if(deskDirty)deskSave()})}

function load(){try{const t=localStorage.getItem(KEY);if(t){const s=JSON.parse(t);if(s&&s.ver===1&&s.accounts){S=s;migrate();buildAccts();return}}}catch(e){}seed();save()}
function nid(p){S.seq[p]=(S.seq[p]||0)+1;return p+'-'+pad(S.seq[p])}
const byId=(arr,id)=>S[arr].find(x=>x.id===id);
const prod=id=>byId('products',id), cust=id=>byId('customers',id), supp=id=>byId('suppliers',id)||{id:'',name:'No supplier',terms:30,pin:'',cat:'',contact:'',phone:'',rating:0}, veh=id=>byId('vehicles',id), emp=id=>byId('employees',id);

/* ============ Ledger ============ */
function post(date,ref,desc,lines){
  lines=lines.filter(l=>Math.abs(l[1])>0.004||Math.abs(l[2])>0.004).map(l=>[l[0],r2(l[1]),r2(l[2])]);for(const l of lines)if(!ACCT[l[0]])throw new Error('Unknown account '+l[0]);
  const dr=lines.reduce((a,l)=>a+l[1],0),cr=lines.reduce((a,l)=>a+l[2],0);
  if(Math.abs(dr-cr)>0.02)throw new Error('Unbalanced entry '+ref);
  const je={id:nid('JE'),date,ref,desc,lines};S.journal.push(je);return je}
function raw(acct,from,to){let s=0;for(const j of S.journal){if(from&&j.date<from)continue;if(to&&j.date>to)continue;for(const l of j.lines)if(l[0]===acct)s+=l[1]-l[2]}return s}
function bal(acct,from,to){const v=raw(acct,from,to);return ['A','X'].includes(ACCT[acct].t)?v:-v}
const cashTotal=()=>cashAccts().reduce((a,c)=>a+bal(c),0);

/* ============ Domain operations ============ */
function createSale(o){
  const c=cust(o.cust);
  const lines=o.lines.map(l=>{const p=prod(l.pid);return{pid:l.pid,qty:l.qty,price:l.price??p.price,cost:p.cost}});
  const total=r2(lines.reduce((a,l)=>a+l.qty*l.price,0)),net=r2(total/1.16),vat=r2(total-net),cost=r2(lines.reduce((a,l)=>a+l.qty*l.cost,0));
  const s={id:nid('INV'),date:o.date,cust:o.cust,lines,total,method:o.method,balance:o.method==='credit'?total:0,
    due:o.method==='credit'?addDays(o.date,c.terms||30):o.date,dispatch:o.dispatch?'pending':'none',et:'Signed',sig:sig16(),cu:'0'+pad(ri(100000,999999),6)+pad(S.seq.INV,4),mpesa:null};
  const crossed=[];for(const l of lines){const p=prod(l.pid);if(p.stock>p.reorder&&p.stock-l.qty<=p.reorder)crossed.push(p.id);p.stock-=l.qty;S.moves.push({date:o.date,pid:l.pid,qty:-l.qty,ref:s.id,type:'Sale'})}
  post(o.date,s.id,'Sale – '+c.name,[[o.method==='credit'?'1100':PAY_ACCT[o.method],total,0],['4000',0,net],['2200',0,vat],['5000',cost,0],['1200',0,cost]]);
  if(o.method==='mpesa'){const code=code10();s.mpesa=code;S.mpesa.push({id:nid('MP'),code,date:o.date,phone:o.phone||'2547'+ri(10000000,99999999),name:c.id==='C01'?'Walk-in':c.name,amount:total,ref:s.id,type:'STK push',status:'Matched',match:s.id})}
  S.sales.push(s);
  if(!SEEDING){audit(`Sale ${s.id} – ${kes(total)} (${METHOD_LABEL[o.method]})`,'sales');lowStockCheck(crossed)}
  return s}
function lowStockCheck(pids){
  for(const id of new Set(pids)){const p=prod(id);if(p.stock<=p.reorder){
    const auto=S.automations.find(a=>a.k==='autopo');
    if(auto&&auto.on){const ex=S.pos.find(po=>po.status==='Draft'&&po.sup===p.sup);
      if(ex){if(!ex.lines.find(l=>l.pid===p.id))ex.lines.push({pid:p.id,qty:Math.max(p.reorder*2-p.stock,1),uom:p.unit,f:1,disc:0,cost:p.cost})}
      else S.pos.push({id:nid('LPO'),sup:p.sup,date:TODAY,expected:addDays(TODAY,7),deliverTo:p.wh,vat:true,terms:supp(p.sup).terms+' days',status:'Draft',lines:[{pid:p.id,qty:Math.max(p.reorder*2-p.stock,1),uom:p.unit,f:1,disc:0,cost:p.cost}],auto:true});
      notify(`${p.name} is at ${p.stock} ${p.unit}s (reorder level ${p.reorder}). Added to a draft PO for ${supp(p.sup).name}.`,'procurement')}
    else notify(`${p.name} is at ${p.stock} ${p.unit}s, below its reorder level of ${p.reorder}.`,'procurement')}}}
const poTotal=po=>r2(po.lines.reduce((a,l)=>a+r2(l.qty*l.cost*(1-Math.min(100,Math.max(0,l.disc||0))/100)),0));
function receivePO(po,date){
  date=date||TODAY;const net=poTotal(po),vat=po.vat===false?0:r2(net*.16),gross=r2(net+vat),s=supp(po.sup);
  for(const l of po.lines){const p=prod(l.pid);const f=l.f||1,units=l.qty*f,uc=l.cost*(1-Math.min(100,Math.max(0,l.disc||0))/100)/f;const old=Math.max(p.stock,0);p.cost=old+units>0?(old*p.cost+units*uc)/(old+units):uc;p.lastCost=uc;p.stock+=units;S.moves.push({date,pid:l.pid,qty:units,ref:po.id,type:'Goods received'})}
  po.status='Received';po.received=date;
  const b={id:nid('BILL'),sup:po.sup,po:po.id,date,due:addDays(date,s.terms),net,vat,amount:gross,paid:0,etims:''};S.bills.push(b);

/* Charts */
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));for(const m of[1,2,2.5,5,10])if(m*p>=v)return m*p;return 10*p}
const short=n=>n>=1e6?(n/1e6).toFixed(n>=1e7?0:1)+'M':n>=1e3?Math.round(n/1e3)+'k':String(Math.round(n));
function barChart(data,opts={}){const W=640,H=opts.h||200,L=44,B=24,T=10,R=8;const max=niceMax(Math.max(...data.map(d=>d.a+(d.b||0))));const bw=(W-L-R)/data.length;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label||'Bar chart')}"><g class="grid">`;
  for(let i=0;i<=4;i++){const y=T+(H-T-B)*(1-i/4);s+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+3}" text-anchor="end">${short(max*i/4)}</text>`}s+='</g>';
  data.forEach((d,i)=>{const x=L+i*bw+bw*.18,w=bw*.64,h1=(H-T-B)*d.a/max,h2=(H-T-B)*(d.b||0)/max,y1=H-B-h1;
    s+=`<rect class="bar ${d.hot?'hot':''}" x="${x}" y="${y1}" width="${w}" height="${Math.max(h1,0)}" rx="2"><title>${esc(d.label)}: ${kes(d.a)}</title></rect>`;
    if(d.b)s+=`<rect class="bar2" x="${x}" y="${y1-h2}" width="${w}" height="${h2}" rx="2"><title>${esc(d.label)}: ${kes(d.b)}</title></rect>`;
    if(i%(opts.every||1)===0||i===data.length-1)s+=`<text x="${x+w/2}" y="${H-8}" text-anchor="middle">${esc(d.label)}</text>`});
  return s+'</svg>'}
function hbars(rows,fmt=kes){const max=Math.max(1,...rows.map(r=>r[1]));return `<div class="hb">${rows.map(([t,v])=>`<div class="hbr"><span class="t" title="${esc(t)}">${esc(t)}</span><span class="track"><span class="fill" style="width:${(v/max*100).toFixed(1)}%;display:block"></span></span><span class="v">${fmt(v)}</span></div>`).join('')}</div>`}

const latin=t=>String(t??'').replace(/[–—]/g,'-').replace(/[‘’]/g,"'").replace(/[^\x00-\xFF]/g,'');
/* Minimal PDF writer: Helvetica text, lines and fills on A4, measured in mm from the top-left. */
const HW=[278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
const tw=(t,size,bold)=>{let w=0;for(const ch of t){const c=ch.charCodeAt(0);w+=c>=32&&c<=126?HW[c-32]:c===183?278:c===215?584:556}return w*size/1000*(bold?1.06:1)/2.8346};
function jpegSize(b){let i=2;while(i<b.length){if(b.charCodeAt(i)!==0xFF)return null;const m=b.charCodeAt(i+1),len=b.charCodeAt(i+2)*256+b.charCodeAt(i+3);if(m>=0xC0&&m<=0xCF&&m!==0xC4&&m!==0xC8&&m!==0xCC)return{h:b.charCodeAt(i+5)*256+b.charCodeAt(i+6),w:b.charCodeAt(i+7)*256+b.charCodeAt(i+8)};i+=2+len}return null}
const hexRgb=h=>{const m=/^#?([0-9a-f]{6})$/i.exec(h||'');if(!m)return[.08,.08,.08];const n=parseInt(m[1],16);return[(n>>16&255)/255,(n>>8&255)/255,(n&255)/255]};
function makePdf(){const pages=[],imgs=[];let cur;const k=2.8346,f=n=>(+n).toFixed(2);
  const esc=t=>{let o='';for(const ch of latin(t)){const c=ch.charCodeAt(0);o+=ch==='('||ch===')'||ch==='\\'?'\\'+ch:c>126?'\\'+c.toString(8).padStart(3,'0'):ch}return o};
  const api={page(){cur=[];pages.push(cur);return api},
    text(x,y,t,o={}){const size=o.size||9,b=!!o.bold;t=latin(t);if(o.align==='right')x-=tw(t,size,b);const g=o.gray===undefined?0.08:o.gray;cur.push(`BT /${b?'F2':'F1'} ${size} Tf ${g===null?'':f(g)+' g '}${f(x*k)} ${f(842-y*k)} Td (${esc(t)}) Tj ET`);return api},
    line(x1,y1,x2,y2,g=0.8){cur.push(`${f(g)} G 0.5 w ${f(x1*k)} ${f(842-y1*k)} m ${f(x2*k)} ${f(842-y2*k)} l S`);return api},
    fill(x,y,w,h,g=0.93){cur.push(`${f(g)} g ${f(x*k)} ${f(842-(y+h)*k)} ${f(w*k)} ${f(h*k)} re f`);return api},
    image(src,x,y,w,h){const m=/^data:image\/jpeg;base64,(.+)$/.exec(src||'');if(!m)return api;const bin=atob(m[1]);const dims=jpegSize(bin);if(!dims)return api;imgs.push({bin,w:dims.w,h:dims.h});const n='Im'+imgs.length;cur.push(`q ${f(w*k)} 0 0 ${f(h*k)} ${f(x*k)} ${f(842-(y+h)*k)} cm /${n} Do Q`);return api},
    color(r,g,b){cur.push(`${f(r)} ${f(g)} ${f(b)} rg`);return api},
    wrap(t,size,maxW){const out=[];let line='';for(const w of latin(t).split(' ')){const tryL=line?line+' '+w:w;if(tw(tryL,size)>maxW&&line){out.push(line);line=w}else line=tryL}out.push(line);return out},
    bytes(){const objs=[];const add=x=>{objs.push(x);return objs.length};
      add('<< /Type /Catalog /Pages 2 0 R >>');add('');add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
      const imIds=imgs.map(im=>add(`<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bin.length} >>\nstream\n${im.bin}\nendstream`));const xo=imIds.length?` /XObject << ${imIds.map((id,i)=>`/Im${i+1} ${id} 0 R`).join(' ')} >>`:'';
      const kids=pages.map(pg=>{const c=pg.join('\n');const ci=add(`<< /Length ${c.length} >>\nstream\n${c}\nendstream`);return add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /Font << /F1 3 0 R /F2 4 0 R >>${xo} >> /Contents ${ci} 0 R >>`)});
      objs[1]=`<< /Type /Pages /Kids [${kids.map(i=>i+' 0 R').join(' ')}] /Count ${kids.length} >>`;
      let out='%PDF-1.4\n';const off=[];objs.forEach((o,i)=>{off.push(out.length);out+=`${i+1} 0 obj\n${o}\nendobj\n`});
      const x=out.length;out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+off.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${x}\n%%EOF`;
      const u=new Uint8Array(out.length);for(let i=0;i<out.length;i++)u[i]=out.charCodeAt(i)&255;return u}};
  return api}
function savePdf(name,o){const d=makePdf().page(),Rx=196;let L=14,y=20;const lg=BIZ().logo;let tx=L;
  if(lg&&lg.src){const h=16,w=Math.min(40,h*lg.w/lg.h);d.image(lg.src,L,y-6,w,h);tx=L+w+5}const bc=hexRgb(BIZ().color);
  d.color(...bc);d.text(tx,y,BIZ().name.toUpperCase(),{size:15,bold:1,gray:null}).text(tx,y+5.5,BIZ().address+' · KRA PIN '+S.etims.pin,{size:8.5,gray:.4}).text(tx,y+9.5,BIZ().phone+' · '+BIZ().email,{size:8.5,gray:.4});
  d.color(...bc).text(Rx,y,o.title,{size:12,bold:1,align:'right',gray:null}).text(Rx,y+5.5,o.no,{size:10,align:'right'});
  y+=14;d.line(L,y,Rx,y,.75);y+=7;
  o.meta.forEach(([kk,v],i)=>{const x=i%2?110:L,yy=y+Math.floor(i/2)*10.5;d.text(x,yy,kk,{size:8,gray:.45}).text(x,yy+4.5,v,{size:9.5})});
  y+=Math.ceil(o.meta.length/2)*10.5+4;
  const cols=o.cols||[{x:L,a:'l'},{x:132,a:'r'},{x:166,a:'r'},{x:Rx,a:'r'}];const cell=(c,t,y0,opt={})=>d.text(c.a==='r'?c.x-2:c.x+2,y0,t,{...opt,align:c.a==='r'?'right':undefined});
  const head=()=>{d.fill(14,y-4.8,Rx-14,7.2);cols.forEach((c,i)=>cell(c,o.head[i],y,{size:8.5,bold:1}));y+=7.5};head();
  o.rows.forEach(r=>{const w=d.wrap(r[0],9,o.wrapW||100);if(y+w.length*4.5>272){d.page();y=20;head()}w.forEach((t,j)=>d.text(cols[0].x+2,y+j*4.5,t));cols.slice(1).forEach((c,i)=>cell(c,r[i+1],y));y+=w.length*4.5+1.5;d.line(14,y-2.2,Rx,y-2.2,.88);y+=2});
  y+=3;o.totals.forEach(([kk,v],i)=>{const last=i===o.totals.length-1;if(last){d.line(130,y-4.5,Rx,y-4.5,.6)}d.text(166,y,kk,{bold:last,size:last?10:9,align:'right'}).text(Rx-2,y,v,{bold:last,size:last?10:9,align:'right'});y+=6});
  y+=8;o.foot.forEach(t=>{d.text(L,y,t,{size:8.5,gray:.4});y+=6});
  saveFile(name,new Blob([d.bytes()],{type:'application/pdf'}))}

function recs(){const r=[];
  if(S.vatReturns)vatMonths().filter(m=>m<MONTH&&!S.vatReturns.some(x=>x.month===m)).forEach(m=>{const c=vatCalc(m);r.push({sev:nextMonth(m)+'-20'<TODAY?'bad':'warn',mod:'Finance',t:`File ${monthName(m)} VAT return`,d:`${c.net>=0?'VAT payable':'Credit'} ${kes(Math.abs(c.net))}. Due 20 ${monthName(nextMonth(m))}.`,a:['Open VAT returns','goto','finance|VAT Returns']})});
  const low=S.products.filter(p=>p.stock<=p.reorder);const bySup={};low.forEach(p=>(bySup[p.sup]=bySup[p.sup]||[]).push(p));
  for(const[sid,ps]of Object.entries(bySup)){const hasDraft=S.pos.some(po=>po.sup===sid&&po.status!=='Received'&&ps.every(p=>po.lines.some(l=>l.pid===p.id)));
    if(!hasDraft)r.push({sev:'bad',mod:'Procurement',t:`Reorder from ${supp(sid).name}`,d:ps.map(p=>`${p.name}: ${p.stock} left, reorder at ${p.reorder}`).join(' · '),a:['Draft purchase order','draftPOFor',sid]})}
  const od=overdueAR();const odC={};od.forEach(s=>{odC[s.cust]=odC[s.cust]||{n:0,v:0,ids:[]};odC[s.cust].n++;odC[s.cust].v+=s.balance;odC[s.cust].ids.push(s.id)});
  Object.entries(odC).sort((a,b)=>b[1].v-a[1].v).slice(0,4).forEach(([cid,o])=>{const c=cust(cid);if(S.activities.some(a=>a.cust===cid&&a.type==='SMS'&&a.date===TODAY))return;r.push({sev:'warn',mod:'Finance',t:`Chase ${kes(o.v)} from ${c.name}`,d:`${o.n} invoice${o.n>1?'s':''} past due. Oldest ${o.ids[0]}.`,a:['Send SMS reminder','remind',cid]})});
  openAP().filter(b=>diffDays(TODAY,b.due)<=7).forEach(b=>r.push({sev:b.due<TODAY?'bad':'info',mod:'Finance',t:`${b.due<TODAY?'Overdue':'Due '+dfmt(b.due)}: ${supp(b.sup).name}`,d:`${b.id} balance ${kes(b.amount-b.paid)}. Cash and bank stand at ${kes(cashTotal())}.`,a:['Pay bill','payBillForm',b.id]}));
  S.vehicles.forEach(v=>{const left=v.lastSvc+v.every-v.odo;if(left<=500&&v.status!=='In service')r.push({sev:left<0?'bad':'warn',mod:'Logistics',t:`Service ${v.reg} (${v.model})`,d:left<0?`${num(-left)} km past its service interval.`:`${num(left)} km until service is due.`,a:['Book service','bookService',v.id]})});
  const pend=S.sales.filter(s=>s.dispatch==='pending');if(pend.length)r.push({sev:'info',mod:'Sales',t:`${pend.length} orders waiting for dispatch`,d:`${S.vehicles.filter(v=>v.status==='Available').length} vehicles available now.`,a:['Open dispatch','goto','sales|Dispatch']});
  const arr=S.bookings.filter(b=>b.status==='Reserved'&&b.checkin===TODAY);arr.forEach(b=>{const rm=S.rooms.find(x=>x.no===b.room);if(rm&&rm.status!=='Vacant clean')r.push({sev:'warn',mod:'Hotel',t:`Room ${b.room} not ready for ${b.guest}`,d:`Arriving today. Room is marked “${rm.status}”.`,a:['Open room board','goto','hotel|Room board']})});
  const sold=new Set(S.sales.filter(s=>s.date>=addDays(TODAY,-21)).flatMap(s=>s.lines.map(l=>l.pid)));S.products.filter(p=>!sold.has(p.id)&&p.stock>0).forEach(p=>r.push({sev:'info',mod:'Sales',t:`${p.name} has not sold in 3 weeks`,d:`${p.stock} ${p.unit}s tied up (${kes(p.stock*p.cost)} at cost). Consider a promotion.`,a:null}));
  const pl=S.leaves.filter(l=>l.status==='Pending');if(pl.length)r.push({sev:'info',mod:'HR',t:`${pl.length} leave request${pl.length>1?'s':''} awaiting approval`,d:pl.map(l=>emp(l.emp).name).join(', '),a:['Review leave','goto','hr|Leave']});
  return r}
function cashForecast(days){const end=addDays(TODAY,days);const inflow=openAR().filter(s=>s.due<=end).reduce((a,s)=>a+s.balance,0);const out=openAP().filter(b=>b.due<=end).reduce((a,b)=>a+b.amount-b.paid,0);const lastRun=S.payruns[S.payruns.length-1];const pay=lastRun&&diffDays(TODAY,MONTH+'-28')<=days&&!S.payruns.some(p=>p.month===MONTH)?lastRun.net:0;return{cash:cashTotal(),inflow,out,pay,end:cashTotal()+inflow-out-pay}}

function entriesIn(from,to){return S.journal.filter(j=>j.date>=from&&j.date<=to)}
function invPaid(s){return r2(s.total-(s.credited||0)-s.balance)}
function invStatus(s){if((s.credited||0)>=s.total-0.5)return['Credited','info'];if(s.balance>0.5)return s.due<TODAY?['Overdue','bad']:['Unpaid','warn'];return['Paid','ok']}

/* VAT engine */
function vatOutput(from,to){let v=0;for(const j of entriesIn(from,to)){if(j.ref.startsWith('VAT'))continue;for(const l of j.lines)if(l[0]==='2200')v+=l[2]-l[1]}return r2(v)}
function vatClaimable(m){const end=monthEnd(m);return purchaseDocs().filter(d=>d.o.etims&&d.date<=end&&!d.o.claimedIn&&d.vat>0)}
function vatUnclaimable(m){const end=monthEnd(m);return purchaseDocs().filter(d=>!d.o.etims&&d.date<=end&&d.vat>0)}
function vatMonths(){const first=S.journal.reduce((a,j)=>j.date<a?j.date:a,TODAY).slice(0,7);const out=[];for(let m=first;m<=MONTH;m=nextMonth(m))out.push(m);return out.reverse()}
function vatCalc(m){const r=S.vatReturns.find(x=>x.month===m);if(r)return r;const out=vatOutput(m+'-01',monthEnd(m));const cl=vatClaimable(m);const inp=r2(cl.reduce((a,d)=>a+d.vat,0));return{month:m,output:out,input:inp,net:r2(out-inp),docs:cl.map(d=>d.id),status:'Open'}}
function fileVat(m){const c=vatCalc(m);const lines=[['2200',Math.max(c.output,0),Math.max(-c.output,0)],['1300',0,c.input]];const net=r2(c.output-c.input);lines.push(net>=0?['2210',0,net]:['2210',-net,0]);
  post(TODAY,'VAT-'+m,'VAT return filed – '+monthName(m),lines);purchaseDocs().filter(d=>c.docs.includes(d.id)).forEach(d=>d.o.claimedIn=m);
  S.vatReturns.push({month:m,output:c.output,input:c.input,net,docs:c.docs,status:net>0?'Filed':'Credit c/f',filed:TODAY,due:nextMonth(m)+'-20'});audit(`VAT return for ${monthName(m)} filed: ${net>=0?'payable':'credit'} ${kes(Math.abs(net))}`,'finance')}

/* Credit notes */
function issueCreditNote(s,o){const date=o.date||TODAY,id=nid('CN'),c=cust(s.cust);
  let lines=o.lines.filter(x=>x.qty>0).map(x=>{const l=s.lines[x.i];return{pid:l.pid,qty:x.qty,price:l.price,cost:l.cost,i:x.i}});
  const total=r2(o.amount>0?o.amount:lines.reduce((a,l)=>a+l.qty*l.price,0)),net=r2(total/1.16),vat=r2(total-net);
  const toAR=r2(Math.min(s.balance,total)),refund=r2(total-toAR);
  const pl=[['4050',net,0],['2200',vat,0],['1100',0,toAR]];if(refund>0)pl.push([PAY_ACCT[o.refundMethod],0,refund]);
  let restockCost=0;
  if(o.restock&&lines.length){for(const l of lines){const p=prod(l.pid);const old=Math.max(p.stock,0);p.cost=old+l.qty>0?(old*p.cost+l.qty*l.cost)/(old+l.qty):l.cost;p.stock+=l.qty;restockCost+=l.qty*l.cost;S.moves.push({date,pid:l.pid,qty:l.qty,ref:id,type:'Credit note return'})}restockCost=r2(restockCost);pl.push(['1200',restockCost,0],['5000',0,restockCost])}
  post(date,id,`Credit note on ${s.id} – ${c.name}`,pl);
  lines.forEach(l=>{s.lines[l.i].cr=(s.lines[l.i].cr||0)+l.qty});s.balance=r2(s.balance-toAR);s.credited=r2((s.credited||0)+total);
  const cn={id,inv:s.id,cust:s.cust,date,lines,total,net,vat,toAR,refund,refundMethod:refund>0?o.refundMethod:null,reason:o.reason,note:o.note||'',restock:!!(o.restock&&lines.length),restockCost,et:'Signed',cu:'0'+pad(ri(100000,999999),6)+pad(S.seq.CN,4),sig:sig16()};
  S.creditNotes.push(cn);audit(`Credit note ${id} on ${s.id}: ${kes(total)} (${o.reason})`,'finance');return cn}

/* Cash-up */
function cashExpected(d){let v=0;for(const j of S.journal){if(j.date!==d||!/^(INV|RCPT|CN)/.test(j.ref))continue;for(const l of j.lines)if(l[0]==='1000')v+=l[1]-l[2]}return r2(v)}
function cashUp(d,counted,bankIt,bank){const exp=cashExpected(d),vr=r2(counted-exp);if(Math.abs(vr)>0.004)post(d,'CASHUP-'+d,'Till cash-up variance',vr>0?[['1000',vr,0],['6410',0,vr]]:[['6410',-vr,0],['1000',0,-vr]]);
  if(bankIt&&counted>0)post(d,'DEP-'+d,'Till takings banked',[[bank||'1020',counted,0],['1000',0,counted]]);
  S.cashups.push({date:d,expected:exp,counted,variance:vr,banked:bankIt?counted:0});audit(`Cash-up ${dfmt(d)}: expected ${kes(exp)}, counted ${kes(counted)}`,'finance')}

/* Line chart */
function lineChart(labels,series,opts={}){const W=640,H=opts.h||210,L=48,B=24,T=10,R=12,n=labels.length;const max=niceMax(Math.max(1,...series.flatMap(s=>s.v)));const x=i=>L+(W-L-R)*(n<2?0:i/(n-1)),y=v=>T+(H-T-B)*(1-v/max);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label||'Line chart')}"><g class="grid">`;for(let i=0;i<=4;i++){const yy=T+(H-T-B)*(1-i/4);s+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text x="${L-6}" y="${yy+3}" text-anchor="end">${short(max*i/4)}</text>`}s+='</g>';
  labels.forEach((l,i)=>{if(i%(opts.every||5)===0)s+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${esc(l)}</text>`});
  series.forEach(se=>{const d=se.v.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');s+=`<path d="${d}" style="fill:none;stroke:${se.c};stroke-width:2;stroke-linejoin:round"/>`;const li=se.v.length-1;s+=`<circle cx="${x(li)}" cy="${y(se.v[li])}" r="3.5" style="fill:${se.c}"><title>${esc(se.n)}: ${kes(se.v[li])}</title></circle>`});
  return s+'</svg>'}

    return `<div style="margin-bottom:16px">${panel({A:'Assets',L:'Liabilities',E:'Equity',I:'Income',X:'Expenses'}[t],tbl([{l:'Code',f:a=>`<span class="mono">${a.code}</span>`},{l:'Account',f:a=>`<b>${esc(a.name)}</b>${a.sub&&a.sub!=='vat'?`<span class="sub">${{cash:'Cash account',mpesa:'M-Pesa account',bank:'Bank account',petty:'Petty cash',control:'Control account – posted from its ledger'}[a.sub]||''}</span>`:''}`},{l:'Normal side',f:a=>['A','X'].includes(a.t)?'Debit':'Credit'},{l:'Entries',n:1,f:a=>cnt[a.code]||0},{l:'Balance',n:1,f:a=>{const v=bal(a.code);return v<0?'('+num(-v)+')':num(v)}},{l:'',f:a=>`<div class="rowacts">${btn('Ledger','viewLedger',a.code)}${a.custom?btn('Rename','renameAccount',a.code):''}</div>`}],as,'',['','Total','','',(tot<0?'('+num(-tot)+')':num(tot)),'']))}</div>`}).join('')};

FIN['General Journals']=()=>{const js=entriesIn(UI.pFrom,UI.pTo).slice().reverse();const f=UI.jF||'All';const SRC={Sales:/^(INV|CN|RCPT)/,Purchases:/^(GRN|BILL|PAY-)/,Banking:/^(DEP|WDL|TRF|CASHUP)/,Payroll:/^PR/,Manual:/^(MJ|REV)/,Hotel:/^BK/,VAT:/^VAT/};
  const list=f==='All'?js:js.filter(j=>SRC[f].test(j.ref));const dr=list.reduce((a,j)=>a+j.lines.reduce((x,l)=>x+l[1],0),0),cr=list.reduce((a,j)=>a+j.lines.reduce((x,l)=>x+l[2],0),0);
  return periodBar(btn('New journal entry','newJournal','','primary'))+`<div class="chips">${['All',...Object.keys(SRC)].map(x=>`<button type="button" class="chip ${f===x?'on':''}" data-act="jFilter" data-id="${x}">${x}</button>`).join('')}</div>`
  +kpis([['Entries',list.length],['Total debits',kes(dr)],['Total credits',kes(cr)],['Difference',kes(dr-cr),Math.abs(dr-cr)<0.01?'Balanced':'Out of balance',Math.abs(dr-cr)<0.01?'ok':'bad']])
  +panel('Journal entries',`<div class="tw"><table><thead><tr><th>Date</th><th>Entry</th><th>Account</th><th class="r">Debit</th><th class="r">Credit</th><th></th></tr></thead><tbody>${list.slice(0,200).map(j=>j.lines.map((l,i)=>`<tr>${i===0?`<td rowspan="${j.lines.length}">${dfmt(j.date)}</td><td rowspan="${j.lines.length}"><span class="mono">${esc(j.ref)}</span><span class="sub">${esc(j.desc)}</span></td>`:''}<td><span class="mono muted">${l[0]}</span> ${esc(acctName(l[0]))}</td><td class="r num">${l[1]?num(l[1]):''}</td><td class="r num">${l[2]?num(l[2]):''}</td>${i===0?`<td rowspan="${j.lines.length}">${/^MJ/.test(j.ref)&&!j.reversed?btn('Reverse','reverseJournal',j.id):j.reversed?pill('Reversed'):''}</td>`:''}</tr>`).join('')).join('')}</tbody></table></div>${list.length>200?'<div class="note">Showing the latest 200 entries in this period.</div>':''}${list.length?'':'<div class="empty">No entries in this period.</div>'}`)};

function bankLines(code,from,to,sign){return entriesIn(from,to).filter(j=>j.lines.some(l=>l[0]===code&&(sign>0?l[1]>0:l[2]>0))).map(j=>{const l=j.lines.find(l=>l[0]===code);return{j,amt:sign>0?l[1]:l[2],other:j.lines.filter(x=>x[0]!==code).map(x=>acctName(x[0])).filter((v,i,a)=>a.indexOf(v)===i).join(', ')}})}
function bankChips(){const bs=banks();if(!bs.includes(UI.bank))UI.bank=bs[0];return `<div class="chips">${bs.map(c=>`<button type="button" class="chip ${UI.bank===c?'on':''}" data-act="pickBank" data-id="${c}">${esc(acctName(c))}</button>`).join('')}</div>`}
FIN['Bank Deposits']=()=>{bankChips();const ls2=bankLines(UI.bank,UI.pFrom,UI.pTo,1);
  return periodBar(btn('Record deposit','newDeposit','','primary'))+bankChips()+kpis([['Deposits in period',kes(ls2.reduce((a,x)=>a+x.amt,0)),ls2.length+' deposits'],['Account balance',kes(bal(UI.bank)),acctName(UI.bank)],['Cash on hand to bank',kes(bal('1000'))],['M-Pesa till to sweep',kes(bal('1010'))]])
  +panel('Money in – '+esc(acctName(UI.bank)),tbl([{l:'Date',f:x=>dfmt(x.j.date)},{l:'Reference',f:x=>`<span class="mono">${esc(x.j.ref)}</span>`},{l:'Description',f:x=>esc(x.j.desc)},{l:'From',f:x=>esc(x.other)},{l:'Amount',n:1,f:x=>num(x.amt)}],ls2.reverse(),'No deposits in this period.',['','','','Total',num(ls2.reduce((a,x)=>a+x.amt,0))]))};
FIN['Bank Withdrawals']=()=>{bankChips();const ls=bankLines(UI.bank,UI.pFrom,UI.pTo,-1);
  return periodBar(btn('Record withdrawal','newWithdrawal','','primary'))+bankChips()+kpis([['Withdrawals in period',kes(ls.reduce((a,x)=>a+x.amt,0)),ls.length+' payments'],['Account balance',kes(bal(UI.bank)),acctName(UI.bank)],['Bank charges in period',kes(bal('6500',UI.pFrom,UI.pTo))],['Owner drawings in period',kes(-bal('3100',UI.pFrom,UI.pTo))]])
  +panel('Money out – '+esc(acctName(UI.bank)),tbl([{l:'Date',f:x=>dfmt(x.j.date)},{l:'Reference',f:x=>`<span class="mono">${esc(x.j.ref)}</span>`},{l:'Description',f:x=>esc(x.j.desc)},{l:'To / for',f:x=>esc(x.other)},{l:'Amount',n:1,f:x=>num(x.amt)}],ls.reverse(),'No withdrawals in this period.',['','','','Total',num(ls.reduce((a,x)=>a+x.amt,0))]))};
function stmtRows(code){const open=raw(code,null,addDays(UI.pFrom,-1));let run=open;const rows=entriesIn(UI.pFrom,UI.pTo).filter(j=>j.lines.some(l=>l[0]===code)).sort((a,b)=>a.date.localeCompare(b.date)).map(j=>{const v=j.lines.filter(l=>l[0]===code).reduce((a,l)=>a+l[1]-l[2],0);run+=v;return{j,v,run}});return{open,rows,close:run}}
FIN['Bank Statement']=()=>{bankChips();const st=stmtRows(UI.bank);const un=st.rows.filter(r=>!S.recon[r.j.id]);
  return periodBar(dlBtn('Download statement (CSV)','csvStatement'))+bankChips()+kpis([['Opening balance',kes(st.open),dfmt(UI.pFrom)],['Money in',kes(st.rows.filter(r=>r.v>0).reduce((a,r)=>a+r.v,0))],['Money out',kes(-st.rows.filter(r=>r.v<0).reduce((a,r)=>a+r.v,0))],['Closing balance',kes(st.close),dfmt(UI.pTo)],['Not yet on bank statement',un.length,kes(un.reduce((a,r)=>a+r.v,0))+' net',un.length?'warn':'ok']])
  +panel('Statement – '+esc(acctName(UI.bank)),`<div class="tw"><table><thead><tr><th>Date</th><th>Reference</th><th>Description</th><th class="r">Money in</th><th class="r">Money out</th><th class="r">Balance</th><th>Bank match</th></tr></thead><tbody><tr><td>${dfmt(UI.pFrom)}</td><td></td><td><b>Opening balance</b></td><td></td><td></td><td class="r num"><b>${num(st.open)}</b></td><td></td></tr>${st.rows.map(r=>`<tr><td>${dfmt(r.j.date)}</td><td><span class="mono">${esc(r.j.ref)}</span></td><td>${esc(r.j.desc)}</td><td class="r num">${r.v>0?num(r.v):''}</td><td class="r num">${r.v<0?num(-r.v):''}</td><td class="r num">${num(r.run)}</td><td>${S.recon[r.j.id]?`<button type="button" class="pill ok" style="border:0;cursor:pointer" data-act="unrecon" data-id="${r.j.id}" title="Undo match">Matched</button>`:btn('Match','recon',r.j.id)}</td></tr>`).join('')}</tbody><tfoot><tr><td></td><td></td><td>Closing balance</td><td></td><td></td><td class="r num">${num(st.close)}</td><td></td></tr></tfoot></table></div>`)};

FIN['Petty Cash & Utilities']=()=>{const pc=entriesIn(UI.pFrom,UI.pTo).filter(j=>j.lines.some(l=>l[0]==='1030'));const ut=['6300','6310','6320'];const uts=entriesIn(UI.pFrom,UI.pTo).filter(j=>j.lines.some(l=>ut.includes(l[0])&&l[1]>0));
  const spent=pc.reduce((a,j)=>a+j.lines.filter(l=>l[0]==='1030').reduce((x,l)=>x+l[2],0),0),topup=pc.reduce((a,j)=>a+j.lines.filter(l=>l[0]==='1030').reduce((x,l)=>x+l[1],0),0);
  return periodBar(btn('Top up petty cash','pettyTopup','')+btn('Pay utility bill','utilityForm','')+btn('Petty cash voucher','pettyVoucher','','primary'))
  +kpis([['Petty cash balance',kes(bal('1030')),bal('1030')<5000?'Running low – top up':'',bal('1030')<5000?'warn':''],['Spent from petty cash',kes(spent)],['Topped up',kes(topup)],['Utilities in period',kes(ut.reduce((a,c)=>a+bal(c,UI.pFrom,UI.pTo),0)),ut.map(c=>acctName(c)+' '+num(bal(c,UI.pFrom,UI.pTo))).join(' · ')]])
  +`<div class="grid g2">${panel('Petty cash book',tbl([{l:'Date',f:j=>dfmt(j.date)},{l:'Voucher',f:j=>`<span class="mono">${esc(j.ref)}</span>`},{l:'Details',f:j=>`${esc(j.desc)}<span class="sub">${esc(j.lines.filter(l=>l[0]!=='1030').map(l=>acctName(l[0])).join(', '))}</span>`},{l:'In',n:1,f:j=>{const v=j.lines.filter(l=>l[0]==='1030').reduce((a,l)=>a+l[1],0);return v?num(v):''}},{l:'Out',n:1,f:j=>{const v=j.lines.filter(l=>l[0]==='1030').reduce((a,l)=>a+l[2],0);return v?num(v):''}}],pc.slice().reverse(),'No petty cash movements in this period.'))}
  ${panel('Utility bills',tbl([{l:'Date',f:j=>dfmt(j.date)},{l:'Details',f:j=>esc(j.desc)},{l:'Utility',f:j=>esc(acctName(j.lines.find(l=>ut.includes(l[0]))[0]))},{l:'Paid from',f:j=>esc(acctName((j.lines.find(l=>l[2]>0)||[''])[0]))},{l:'Amount',n:1,f:j=>num(j.lines.filter(l=>ut.includes(l[0])).reduce((a,l)=>a+l[1],0))}],uts.slice().reverse(),'No utility bills in this period.'))}</div>`};

FIN['POS Daily Totals']=()=>{const days=[];for(let d=UI.pTo;d>=UI.pFrom&&days.length<62;d=addDays(d,-1))days.push(d);
  const row=d=>{const ss=S.sales.filter(s=>s.date===d),cn=S.creditNotes.filter(c=>c.date===d);const m=k=>ss.filter(s=>s.method===k).reduce((a,s)=>a+s.total,0);const g=ss.reduce((a,s)=>a+s.total,0),c=cn.reduce((a,x)=>a+x.total,0);return{d,n:ss.length,cash:m('cash'),mpesa:m('mpesa'),bank:m('bank'),credit:m('credit'),g,vat:r2(g-g/1.16),cn:c,net:g-c,cu:S.cashups.find(x=>x.date===d)}};
  const rows=days.map(row).filter(r=>r.n||r.cn||r.d===TODAY);const T=k=>rows.reduce((a,r)=>a+r[k],0);
  return periodBar()+kpis([['Gross takings',kes(T('g')),T('n')+' sales'],['Cash',kes(T('cash'))],['M-Pesa',kes(T('mpesa'))],['On account',kes(T('credit'))],['Credit notes',kes(T('cn'))],['Net sales',kes(T('net'))]])
  +panel('Daily totals (Z-report)',tbl([{l:'Day',f:r=>`<b>${dfmt(r.d)}</b><span class="sub">${new Date(r.d+'T12:00:00Z').toLocaleDateString('en-GB',{weekday:'short',timeZone:'UTC'})}</span>`},{l:'Sales',n:1,f:r=>r.n},{l:'Cash',n:1,f:r=>num(r.cash)},{l:'M-Pesa',n:1,f:r=>num(r.mpesa)},{l:'Bank',n:1,f:r=>num(r.bank)},{l:'On account',n:1,f:r=>num(r.credit)},{l:'Gross',n:1,f:r=>num(r.g)},{l:'VAT',n:1,f:r=>num(r.vat)},{l:'Credit notes',n:1,f:r=>r.cn?'('+num(r.cn)+')':'—'},{l:'Net',n:1,f:r=>`<b>${num(r.net)}</b>`},{l:'Cash-up',f:r=>r.cu?`${pill('Closed','ok')}<span class="sub">${Math.abs(r.cu.variance)<0.5?'No variance':(r.cu.variance>0?'Over ':'Short ')+num(Math.abs(r.cu.variance))}</span>`:btn('Cash up','cashUpForm',r.d,'sm primary')}],rows,'No sales in this period.',['Totals',String(T('n')),num(T('cash')),num(T('mpesa')),num(T('bank')),num(T('credit')),num(T('g')),num(T('vat')),num(T('cn')),num(T('net')),'']))};

FIN['Financial Reporting']=()=>{const v=UI.frView||'Profit & loss';let body='';
  if(v==='Profit & loss'){const p=plData(UI.pFrom,UI.pTo);body=`<table><tbody>${sRow('<b>Revenue</b>',null)}${p.inc.map(x=>sRow(esc(x.a.name),x.v)).join('')}${sRow('<b>Total revenue</b>',p.ti,'tt')}${sRow('Cost of goods sold',p.tc)}${sRow('<b>Gross profit</b>',p.gp,'tt')}${sRow(`<span class="muted">Gross margin ${p.ti?(p.gp/p.ti*100).toFixed(1):0}%</span>`,null)}${sRow('<b>Operating expenses</b>',null)}${p.opex.map(x=>sRow(esc(x.a.name),x.v)).join('')}${sRow('<b>Total operating expenses</b>',p.to,'tt')}</tbody><tfoot>${sRow('Net profit',p.np)}</tfoot></table>`}
  if(v==='Balance sheet'){const b=bsData(UI.pTo);body=`<table><tbody>${sRow('<b>Assets</b>',null)}${b.A.map(x=>sRow(esc(x.a.name),x.v)).join('')}${sRow('<b>Total assets</b>',b.ta,'tt')}${sRow('<b>Liabilities</b>',null)}${b.L.map(x=>sRow(esc(x.a.name),x.v)).join('')}${sRow('<b>Total liabilities</b>',b.tl,'tt')}${sRow('<b>Equity</b>',null)}${b.E.map(x=>sRow(esc(x.a.name),x.v)).join('')}${sRow('Retained profit to date',b.re)}${sRow('<b>Total equity</b>',b.te,'tt')}</tbody><tfoot>${sRow('Liabilities + equity',b.tl+b.te)}</tfoot></table><div class="note">${Math.abs(b.ta-b.tl-b.te)<1?pill('Balanced','ok')+' Assets equal liabilities plus equity.':pill('Out of balance','bad')}</div>`}
  if(v==='Trial balance'){const t=tbData(UI.pTo);const dr=t.reduce((a,x)=>a+Math.max(x.v,0),0),cr=t.reduce((a,x)=>a-Math.min(x.v,0),0);body=tbl([{l:'Code',f:x=>`<span class="mono">${x.a.code}</span>`},{l:'Account',f:x=>esc(x.a.name)},{l:'Type',f:x=>TYPE_LABEL[x.a.t]},{l:'Debit',n:1,f:x=>x.v>0?num(x.v):''},{l:'Credit',n:1,f:x=>x.v<0?num(-x.v):''}],t,'',['','Totals','',num(dr),num(cr)])+`<div class="note">${Math.abs(dr-cr)<0.01?pill('Balanced','ok'):pill('Out of balance','bad')}</div>`}
  if(v==='Cash flow'){const c=cfData(UI.pFrom,UI.pTo);const net=Object.values(c.cats).reduce((a,x)=>a+x,0);body=`<table><tbody>${sRow('Opening cash, M-Pesa & bank',c.open,'tt')}${Object.entries(c.cats).filter(([,x])=>Math.abs(x)>0.004).map(([k,x])=>sRow(k,x)).join('')}${sRow('<b>Net change in cash</b>',net,'tt')}</tbody><tfoot>${sRow('Closing cash, M-Pesa & bank',c.close)}</tfoot></table><div class="note">${Math.abs(c.open+net-c.close)<1?pill('Reconciles','ok')+' Opening plus net change equals closing.':pill('Does not reconcile','bad')}</div>`}
  return periodBar(dlBtn('Download report (CSV)','csvReport'))+`<div class="chips">${['Profit & loss','Balance sheet','Trial balance','Cash flow'].map(x=>`<button type="button" class="chip ${v===x?'on':''}" data-act="frView" data-id="${x}">${x}</button>`).join('')}</div>`
  +panel(`${v} <span class="muted" style="font-family:var(--body);font-weight:400;font-size:13px">${v==='Balance sheet'||v==='Trial balance'?'as at '+dfmt(UI.pTo)+' '+UI.pTo.slice(0,4):dfmt(UI.pFrom)+' – '+dfmt(UI.pTo)+' '+UI.pTo.slice(0,4)}</span>`,`<div class="tw stmt">${body}</div>`)};

FIN['Sales Analysis Reports']=()=>{const ss=salesIn(UI.pFrom,UI.pTo),cn=cnIn(UI.pFrom,UI.pTo);const gross=ss.reduce((a,s)=>a+s.total,0),crt=cn.reduce((a,c)=>a+c.total,0);const net=(gross-crt)/1.16;
  const cogs=ss.reduce((a,s)=>a+s.lines.reduce((x,l)=>x+l.qty*l.cost,0),0)-cn.reduce((a,c)=>a+(c.restockCost||0),0);
  const bp={},bc={},bseg={},bm={};ss.forEach(s=>{const c=cust(s.cust);bc[s.cust]=bc[s.cust]||{n:0,v:0,bal:0};bc[s.cust].n++;bc[s.cust].v+=s.total;bc[s.cust].bal+=s.balance;bseg[c.seg]=(bseg[c.seg]||0)+s.total;bm[s.method]=(bm[s.method]||0)+s.total;s.lines.forEach(l=>{bp[l.pid]=bp[l.pid]||{q:0,v:0,c:0};bp[l.pid].q+=l.qty;bp[l.pid].v+=l.qty*l.price;bp[l.pid].c+=l.qty*l.cost})});
  cn.forEach(c=>c.lines.forEach(l=>{if(bp[l.pid]){bp[l.pid].q-=l.qty;bp[l.pid].v-=l.qty*l.price;if(c.restock)bp[l.pid].c-=l.qty*l.cost}}));
  const days=[];for(let d=UI.pFrom;d<=UI.pTo&&days.length<93;d=addDays(d,1))days.push(d);
  return periodBar(dlBtn('Download (CSV)','csvSales'))+kpis([['Gross sales (incl. VAT)',kes(gross),ss.length+' invoices'],['Credit notes',kes(crt),cn.length+' issued'],['Net sales (ex VAT)',kes(net)],['Gross profit',kes(net-cogs),net?((net-cogs)/net*100).toFixed(1)+'% margin':''],['Average invoice',kes(ss.length?gross/ss.length:0)]])
  +panel('Daily sales',`<div class="pb">${barChart(days.map(d=>({label:dfmt(d),a:S.sales.filter(s=>s.date===d).reduce((a,s)=>a+s.total,0)})),{every:Math.max(1,Math.ceil(days.length/10)),label:'Daily sales'})}</div>`)
  +`<div class="grid g2" style="margin-top:16px">${panel('By product',tbl([{l:'Product',f:r=>esc(prod(r[0]).name)},{l:'Qty',n:1,f:r=>num(r[1].q)},{l:'Sales incl. VAT',n:1,f:r=>num(r[1].v)},{l:'Gross profit',n:1,f:r=>num(r[1].v/1.16-r[1].c)},{l:'Margin',n:1,f:r=>r[1].v?((r[1].v/1.16-r[1].c)/(r[1].v/1.16)*100).toFixed(1)+'%':'—'}],Object.entries(bp).sort((a,b)=>b[1].v-a[1].v),'No sales in this period.'))}
  ${panel('By customer',tbl([{l:'Customer',f:r=>esc(cust(r[0]).name)},{l:'Invoices',n:1,f:r=>r[1].n},{l:'Sales',n:1,f:r=>num(r[1].v)},{l:'Unpaid',n:1,f:r=>r[1].bal>0.5?num(r[1].bal):'—'}],Object.entries(bc).sort((a,b)=>b[1].v-a[1].v),'No sales in this period.'))}
  ${panel('By customer segment',`<div class="pb">${hbars(Object.entries(bseg).sort((a,b)=>b[1]-a[1]))}</div>`)}
  ${panel('By payment method',`<div class="pb">${hbars(Object.entries(bm).sort((a,b)=>b[1]-a[1]).map(([k,v])=>[METHOD_LABEL[k],v]))}</div>`)}</div>`};

function purchasesIn(from,to){const out=[];S.bills.filter(b=>!b.po.startsWith('GRN')&&b.date>=from&&b.date<=to).forEach(b=>{const po=byId('pos',b.po);out.push({id:b.id,src:b.po,sup:b.sup,date:b.date,net:b.net,vat:b.vat,amount:b.amount,owed:b.amount-b.paid,lines:po?po.lines.map(l=>({pid:l.pid,qty:l.qty*(l.f||1),cost:l.cost*(1-(l.disc||0)/100)/(l.f||1)})):[]})});
  S.receipts.filter(r=>r.date>=from&&r.date<=to).forEach(r=>{const b=r.bill&&byId('bills',r.bill);out.push({id:r.id,src:r.ref||'Counter receipt',sup:r.sup,date:r.date,net:r.net,vat:r.vat,amount:r.amount,owed:b?b.amount-b.paid:0,lines:r.lines})});return out}
FIN['Purchase Analysis Reports']=()=>{const ps=purchasesIn(UI.pFrom,UI.pTo);const bs={},bp={};ps.forEach(p=>{bs[p.sup]=bs[p.sup]||{n:0,net:0,vat:0,amt:0,owed:0};const x=bs[p.sup];x.n++;x.net+=p.net;x.vat+=p.vat;x.amt+=p.amount;x.owed+=p.owed;p.lines.forEach(l=>{bp[l.pid]=bp[l.pid]||{q:0,v:0,last:0,ld:''};bp[l.pid].q+=l.qty;bp[l.pid].v+=l.qty*l.cost;if(p.date>=bp[l.pid].ld){bp[l.pid].last=l.cost;bp[l.pid].ld=p.date}})});
  const T=k=>ps.reduce((a,p)=>a+p[k],0);

const lineF=l=>l.f||1, lineDisc=l=>Math.min(100,Math.max(0,l.disc||0));

function lpoRow(l={}){const p=prod(l.pid)||S.products[0];if(!p)return '';const us=lpoUoms(p);const f=lineF(l);const cost=l.cost??r2(p.cost*f);
  return `<div class="lr"><select class="lp" aria-label="Item">${opt(S.products.map(x=>[x.id,x.name]),p.id)}</select><input class="lq" type="number" min="0" step="any" value="${l.qty??1}" aria-label="Quantity"><select class="lu" aria-label="Unit of measure">${us.map(([n,ff])=>`<option value="${ff}" ${ff==f?'selected':''}>${esc(n)}${ff>1?` = ${ff} ${esc(p.unit)}s`:''}</option>`).join('')}</select><input class="lc" type="number" min="0" step="any" value="${r2(cost)}" aria-label="Unit cost"><input class="ld" type="number" min="0" max="100" step="any" value="${lineDisc(l)}" aria-label="Discount percent"><span class="lt num">0</span><button type="button" data-act="rmLine" aria-label="Remove line">×</button></div>`}
function lpoRecalc(box){if(!box)return;let sub=0,dsc=0;box.querySelectorAll('.lr').forEach(r=>{const q=+r.querySelector('.lq').value||0,c=+r.querySelector('.lc').value||0,d=Math.min(100,Math.max(0,+r.querySelector('.ld').value||0));const g=q*c,dd=g*d/100;sub+=g;dsc+=dd;r.querySelector('.lt').textContent=num(g-dd)});
  const vatOn=(document.getElementById('f_vat')||{}).value!=='no';const net=sub-dsc,vat=vatOn?net*.16:0;const t=document.getElementById(box.id+'_tot');
  if(t)t.innerHTML=[['Subtotal',sub],['Discount',-dsc],['Net',net],[vatOn?'VAT 16%':'VAT (not charged)',vat],['Total',net+vat]].map(([k,v],i,a)=>`<div class="tot ${i===a.length-1?'big':''}"><span>${k}</span><span class="mono">${v<0?'−'+num(-v):num(v)}</span></div>`).join('')}

  S.creditNotes.filter(c=>c.date>=from&&c.date<=to).forEach(c=>c.lines.forEach(l=>{const x=g(l.pid);x.qty-=l.qty;x.gross-=l.qty*l.price;if(c.restock)x.cost-=l.qty*l.cost}));return m}

const T_METRIC={sales:'Net sales (ex VAT)',gp:'Gross profit',units:'Units sold',collections:'Collections',rooms:'Room revenue (ex VAT)'};
function tScopes(){return[['all|','Whole company'],...[...new Set(S.products.map(p=>p.cat))].map(c=>['cat|'+c,'Category: '+c]),...[...new Set(S.customers.filter(c=>c.id!=='C01').map(c=>c.seg))].map(s=>['seg|'+s,'Segment: '+s]),...S.products.map(p=>['prod|'+p.id,'Product: '+p.name]),...S.customers.filter(c=>c.id!=='C01').map(c=>['cust|'+c.id,'Customer: '+c.name])]}
const tScopeLabel=sc=>(tScopes().find(x=>x[0]===sc)||[0,sc])[1];
function tActual(t,from,to){const[sc,sv]=t.scope.split('|');const cash=cashAccts();
  if(t.metric==='collections'){let v=0;for(const j of entriesIn(from,to)){if(!/^(INV|RCPT|BK|CN)/.test(j.ref))continue;if(sc==='cust'||sc==='seg'){const s=S.sales.find(x=>j.ref.endsWith(x.id));const c=s&&cust(s.cust);if(!c||(sc==='cust'&&c.id!==sv)||(sc==='seg'&&c.seg!==sv))continue}for(const l of j.lines)if(cash.includes(l[0]))v+=l[1]-l[2]}return v}
  if(t.metric==='rooms')return bal('4100',from,to);
  const mt=(c,l)=>sc==='all'||(sc==='cat'&&prod(l.pid).cat===sv)||(sc==='prod'&&l.pid===sv)||(sc==='seg'&&cust(c).seg===sv)||(sc==='cust'&&c===sv);let v=0;
  S.sales.filter(s=>s.date>=from&&s.date<=to).forEach(s=>s.lines.forEach(l=>{if(!mt(s.cust,l))return;v+=t.metric==='sales'?l.qty*l.price/1.16:t.metric==='gp'?l.qty*(l.price/1.16-l.cost):l.qty}));
  S.creditNotes.filter(c=>c.date>=from&&c.date<=to).forEach(c=>{if(c.lines.length)c.lines.forEach(l=>{if(!mt(c.cust,l))return;v-=t.metric==='sales'?l.qty*l.price/1.16:t.metric==='gp'?l.qty*(l.price/1.16-(c.restock?l.cost:0)):l.qty});else if(t.metric!=='units'&&(sc==='all'||(sc==='cust'&&c.cust===sv)||(sc==='seg'&&cust(c.cust).seg===sv)))v-=c.net});return v}
function tProgress(t){const from=t.month+'-01',end=monthEnd(t.month),D=daysIn(from,end);const e=t.month<MONTH?D:t.month>MONTH?0:daysIn(from,TODAY);const act=e?tActual(t,from,t.month===MONTH?TODAY:end):0;const exp=t.value*e/D,proj=e?act/e*D:0;
  const st=t.month<MONTH?(act>=t.value?['Achieved','ok']:['Missed','bad']):t.month>MONTH?['Not started','']:act>=t.value?['Achieved','ok']:proj>=t.value?['On track','ok']:proj>=t.value*0.9?['At risk','warn']:['Behind','bad'];return{act,exp,proj,pct:t.value?act/t.value*100:0,st,e,D}}
const tFmt=(t,v)=>t.metric==='units'?num(v):kes(v);
function targetsView(){const ms=[nextMonth(MONTH),MONTH,prevMonth(MONTH),prevMonth(prevMonth(MONTH))];const m=ms.includes(UI.tM)?UI.tM:MONTH;const ts=S.targets.filter(t=>t.month===m);const pr=ts.map(t=>({t,...tProgress(t)}));const cnt=k=>pr.filter(x=>x.st[0]===k).length;
  const main=ts.find(t=>t.metric==='sales'&&t.scope==='all|');let chart='';
  if(main&&m<=MONTH){const from=m+'-01',end=monthEnd(m),D=daysIn(from,end),upto=m===MONTH?TODAY:end;const days=[];for(let d=from;d<=end;d=addDays(d,1))days.push(d);let run=0;const act=days.map(d=>{if(d>upto)return null;run+=tActual(main,d,d);return run});const lastA=act.filter(x=>x!=null);
    chart=panel(`Net sales vs target – ${monthName(m)}`,`<div class="pb">${lineChart(days.map(dfmt),[{n:'Target pace',v:days.map((_,i)=>main.value*(i+1)/D),c:'var(--muted)'},{n:'Actual (cumulative)',v:lastA,c:'var(--accent)'}].map(s=>s.n==='Actual (cumulative)'?{...s,v:s.v}:s),{every:5,label:'Sales against target'})}<div class="legend"><span><i style="background:var(--muted)"></i>Target pace to ${kes(main.value)}</span><span><i style="background:var(--accent)"></i>Actual to date ${kes(lastA[lastA.length-1]||0)}</span></div></div>`)}
  return `<div class="pbar" style="justify-content:space-between"><div class="chips" style="margin:0">${ms.map(x=>`<button type="button" class="chip ${m===x?'on':''}" data-act="tMonth" data-id="${x}">${monthName(x)}</button>`).join('')}</div><div style="display:flex;gap:8px">${btn('Copy to next month','copyTargets',m)}${btn('Add target','editTarget','','primary')}</div></div>`
  +kpis([['Targets',ts.length,monthName(m)],['Achieved',cnt('Achieved'),'','ok'],['On track',cnt('On track'),'','ok'],['At risk',cnt('At risk'),'',cnt('At risk')?'warn':''],['Behind or missed',cnt('Behind')+cnt('Missed'),'',cnt('Behind')+cnt('Missed')?'bad':'']])
  +(chart?chart+'<div style="height:16px"></div>':'')
  +panel('Targets – '+monthName(m),tbl([{l:'Measure',f:x=>`<div style="min-width:170px"><b>${esc(T_METRIC[x.t.metric])}</b><span class="sub">${esc(tScopeLabel(x.t.scope))}</span></div>`},{l:'Target',n:1,f:x=>tFmt(x.t,x.t.value)},{l:'Actual',n:1,f:x=>tFmt(x.t,x.act)},{l:'Achieved',f:x=>`<div style="display:flex;align-items:center;gap:8px;min-width:110px"><div class="meter" style="flex:1"><i style="width:${Math.min(100,x.pct).toFixed(1)}%;background:${x.st[1]==='bad'?'var(--bad)':x.st[1]==='warn'?'var(--warn)':'var(--accent)'}"></i></div><span class="mono" style="font-size:12px">${x.pct.toFixed(0)}%</span></div>`},{l:'Expected by today',n:1,f:x=>x.e&&x.e<x.D?tFmt(x.t,x.exp):'—'},{l:'Projected month end',n:1,f:x=>x.e&&x.e<x.D?tFmt(x.t,x.proj):'—'},{l:'Status',f:x=>pill(x.st[0],x.st[1])},{l:'',f:x=>`<div class="rowacts" style="flex-wrap:nowrap">${btn('Edit','editTarget',x.t.id)}${btn('×','delTarget',x.t.id,'sm danger')}</div>`}],pr,'No targets set for this month. Add one, or copy last month’s.'))
  +`<p class="muted" style="font-size:12.5px">“Expected by today” is the target spread evenly over the month. “Projected” extends the daily rate so far to the end of the month.</p>`}

function permEditor(r){const sel=(mod,tab,val,inherit)=>`<select data-ch="perm" data-mod="${mod}" data-tab="${esc(tab||'')}" ${r.locked?'disabled':''} aria-label="${esc(tab||mod)} access">${tab?`<option value="" ${!val?'selected':''}>Same as menu (${LV_LABEL[inherit]})</option>`:''}${['full','view','none'].map(l=>`<option value="${l}" ${val===l?'selected':''}>${LV_LABEL[l]}</option>`).join('')}</select>`;
  return panel(`Permissions – ${esc(r.name)}`,`${r.locked?'<div class="note" style="border-top:0;border-bottom:1px solid var(--line)">Administrators always have full access to everything, so this role cannot be limited.</div>':''}<div class="tw"><table class="perm"><tbody>${MODS.map(m=>{const p=r.perms[m.k]||{level:'none',tabs:{}};const vis=m.tabs.filter(t=>roleAccess(r,m.k,t)!=='none').length;
    return `<tr class="pm"><td><b>${m.n}</b><span class="sub">${r.locked?'All tabs':vis===m.tabs.length?'All '+m.tabs.length+' tabs visible':vis?vis+' of '+m.tabs.length+' tabs visible':'Hidden from the menu'}</span></td><td>${sel(m.k,'',r.locked?'full':p.level)}</td></tr>${m.tabs.map(t=>`<tr class="pt"><td>${esc(t)}</td><td>${sel(m.k,t,r.locked?'':p.tabs[t]||'',r.locked?'full':p.level)}</td></tr>`).join('')}`}).join('')}</tbody></table></div>`,btn('Done','permDone',''))}
function usersPermsView(){const me=curUser();
  return `<div class="callout">You are signed in as <b>${esc(me.name)}</b> (${esc(me.role)}). Menus and tabs a role has no access to are hidden. View-only screens show the data with the change buttons locked.</div>`
  +panel('Users',tbl([{l:'Name',f:u=>`<b>${esc(u.name)}</b>${u.id===me.id?' '+pill('You','acc'):''}<span class="sub">${esc(u.email||'')}</span>`},{l:'Role',f:u=>pill(u.role,u.role==='Administrator'?'gold':'acc')},{l:'PIN',f:u=>u.pin?pill('PIN set','ok'):pill('No PIN',u.role==='Administrator'?'bad':'')},{l:'Status',f:u=>u.active===false?pill('Disabled','bad'):pill('Active','ok')},{l:'Last active',f:u=>u.last?dfmt(u.last):'—'},{l:'',f:u=>`<div class="rowacts">${btn('Edit','editUser',u.id)}${u.id!==me.id&&u.active!==false?btn('Sign in as','pickUser',u.id):''}</div>`}],S.users),btn('Add user','editUser','','primary'))
  +'<div style="height:16px"></div>'+panel('Roles',tbl([{l:'Role',f:r=>`<b>${esc(r.name)}</b>${r.locked?'<span class="sub">Always full access</span>':''}`},{l:'Users',n:1,f:r=>S.users.filter(u=>u.role===r.name).length},{l:'Menus',f:r=>{const c={full:0,view:0,none:0};MODS.forEach(m=>{const ls=m.tabs.map(t=>roleAccess(r,m.k,t));c[ls.includes('full')?'full':ls.includes('view')?'view':'none']++});return `${c.full} full · ${c.view} view only · ${c.none} hidden`}},{l:'',f:r=>`<div class="rowacts">${btn(r.locked?'View':'Edit permissions','permRole',r.id,r.locked?'sm':'sm primary')}${r.locked?'':btn('Rename','renameRole',r.id)+btn('Delete','delRole',r.id,'sm danger')}</div>`}],S.roles),btn('Add role','newRole','','primary'))
  +(UI.permRole&&S.roles.find(r=>r.id===UI.permRole)?'<div style="height:16px" id="permAnchor"></div>'+permEditor(S.roles.find(r=>r.id===UI.permRole)):'')}

Object.assign(A,{
  switchUser:()=>{const me=curUser();openModal('Switch user',`<p class="muted" style="margin-top:0">Signed in as <b>${esc(me.name)}</b>. Choose who is using Bigwiz now.</p><div style="display:flex;flex-direction:column;gap:6px">${S.users.filter(u=>u.active!==false).map(u=>`<button type="button" class="btn" style="display:flex;justify-content:space-between;align-items:center;text-align:left;padding:10px 12px" data-act="pickUser" data-id="${u.id}" ${u.id===me.id?'disabled':''}><span><b>${esc(u.name)}</b><br><span class="muted" style="font-weight:400">${esc(u.role)}</span></span><span class="muted" style="font-weight:400">${u.id===me.id?'Signed in':u.pin?'PIN required':''}</span></button>`).join('')}</div>`)},
  pickUser:id=>{const u=S.users.find(x=>x.id===id);const go=()=>{UI.uid=u.id;u.last=TODAY;try{localStorage.setItem(KEY+'-user',u.id)}catch(e){}audit('Signed in as '+u.name,'settings');UI.permRole='';closeModal();render();toast('Signed in as '+u.name+' ('+u.role+').')};
    if(!u.pin){go();save();return 'keep'}openForm({title:'PIN for '+u.name,fields:[{k:'pin',l:'PIN',t:'password',req:1}],submit:'Sign in',onSubmit:v=>{if(v.pin!==u.pin)return 'That PIN is not right.';setTimeout(go,0)}});return 'keep'},
  editUser:id=>{const u=id?S.users.find(x=>x.id===id):null;const me=curUser();openForm({title:u?'Edit '+u.name:'Add user',fields:[{t:'row',f:[{k:'name',l:'Full name',v:u?u.name:'',req:1},{k:'email',l:'Email',t:'email',v:u?u.email:''}]},{t:'row',f:[{k:'role',l:'Role',t:'select',o:S.roles.map(r=>[r.name,r.name]),v:u?u.role:'Sales'},{k:'active',l:'Status',t:'select',o:[['yes','Active'],['no','Disabled']],v:u&&u.active===false?'no':'yes'}]},{k:'pin',l:u&&u.pin?'New PIN (leave blank to keep the current one)':'PIN (4–6 digits, asked when switching to this user)',t:'password'}],submit:u?'Save user':'Add user',
    onSubmit:v=>{if(v.pin&&!/^\d{4,6}$/.test(v.pin))return 'PINs are 4 to 6 digits.';if(v.email&&!/^\S+@\S+\.\S+$/.test(v.email))return 'Enter a valid email address.';
      const admins=S.users.filter(x=>x.role==='Administrator'&&x.active!==false&&x!==u);if(u&&u.role==='Administrator'&&(v.role!=='Administrator'||v.active==='no')&&!admins.length)return 'Keep at least one active Administrator.';if(u&&u.id===me.id&&v.active==='no')return 'You cannot disable the user you are signed in as.';
      const data={name:v.name,email:v.email,role:v.role,active:v.active!=='no'};if(v.pin)data.pin=v.pin;
      if(u){Object.assign(u,data);audit(`Updated user ${u.name} (${u.role})`,'settings')}else{S.users.push({id:nid('U'),pin:'',last:'',...data});audit(`Added user ${v.name} as ${v.role}`,'settings')}}})},
  newUser:()=>A.editUser(''),
  permRole:id=>{UI.permRole=id;setTimeout(()=>{const a=document.getElementById('permAnchor');if(a)a.scrollIntoView({behavior:'smooth'})},50)},
  permDone:()=>{UI.permRole=''},
  newRole:()=>openForm({title:'Add role',fields:[{k:'name',l:'Role name',req:1,ph:'e.g. Branch manager'},{k:'from',l:'Start from',t:'select',o:S.roles.map(r=>[r.id,'Copy of '+r.name])}],onSubmit:v=>{if(S.roles.some(r=>r.name.toLowerCase()===v.name.toLowerCase()))return 'That role name exists.';const src=S.roles.find(r=>r.id===v.from);const r={id:nid('R'),name:v.name,locked:false,perms:JSON.parse(JSON.stringify(src.perms))};if(src.locked)Object.values(r.perms).forEach(p=>{p.level='full';p.tabs={}});S.roles.push(r);UI.permRole=r.id;audit('Added role '+v.name,'settings')}}),
  renameRole:id=>{const r=S.roles.find(x=>x.id===id);openForm({title:'Rename role',fields:[{k:'name',l:'Role name',v:r.name,req:1}],onSubmit:v=>{if(S.roles.some(x=>x!==r&&x.name.toLowerCase()===v.name.toLowerCase()))return 'That role name exists.';S.users.forEach(u=>{if(u.role===r.name)u.role=v.name});r.name=v.name}})},
  delRole:id=>{const r=S.roles.find(x=>x.id===id);const n=S.users.filter(u=>u.role===r.name).length;if(n)return toast(`Move the ${n} user${n>1?'s':''} with this role to another role first.`);confirmBox('Delete role','Delete the '+esc(r.name)+' role?','Delete',()=>{S.roles=S.roles.filter(x=>x!==r);if(UI.permRole===id)UI.permRole='';audit('Deleted role '+r.name,'settings')},true)},
});

/* ============ Events ============ */
document.addEventListener('click',e=>{
  const nav=e.target.closest('[data-nav]');if(nav){e.preventDefault();UI.mod=nav.dataset.nav;location.hash=UI.mod;render();window.scrollTo(0,0);return}
  const tab=e.target.closest('[data-tab]');if(tab){UI.tab[UI.mod]=tab.dataset.tab;render();return}
  const a=e.target.closest('[data-act]');if(!a)return;const fn=A[a.dataset.act];if(!fn)return;e.preventDefault();
  const act=a.dataset.act;if(ADMIN_ONLY.test(act)&&access('settings','Data & backup')!=='full')return toast('Only a user with full access to Settings → Data & backup can do this.');if(!SAFE.test(act)&&!ADMIN_ONLY.test(act)&&!/^(addLine|rmLine|addJLine|addLpoLine)$/.test(act)&&curLevel()!=='full')return toast('View only. Your role cannot change this.');
  const r=fn(a.dataset.id,a);if(r!=='keep'&&document.getElementById('modal').hidden){save();render()}else save()});
document.addEventListener('submit',e=>{if(e.target.id==='mform'){e.preventDefault();SUBMIT&&SUBMIT()}});
document.addEventListener('input',e=>{const lb=e.target.closest&&e.target.closest('.lines.lpo');if(lb){lpoRecalc(lb);return}const k=e.target.dataset.in;if(!k)return;UI[k]=e.target.value;if(k==='posQ'){document.getElementById('pgrid').innerHTML=posGrid()}if(k==='invQ'){const el=document.getElementById('invList');if(el)el.innerHTML=invList()}});
document.addEventListener('change',e=>{const t=e.target;if(t.matches('.lines.lpo .lp')){const r=t.closest('.lr'),box=t.closest('.lines');r.outerHTML=lpoRow({pid:t.value,qty:+r.querySelector('.lq').value||1});lpoRecalc(box);return}
  if(t.matches('.lines.lpo .lu')){const r=t.closest('.lr'),p=prod(r.querySelector('.lp').value);r.querySelector('.lc').value=r2(p.cost*(+t.value||1));lpoRecalc(t.closest('.lines'));return}
  if(t.id==='f_vat'&&document.getElementById('f_lines')&&document.getElementById('f_lines').classList.contains('lpo')){lpoRecalc(document.getElementById('f_lines'));return}
  if(t.id==='osDays'){UI.osDays=Math.max(1,+t.value||45);render();return}
  if(e.target.matches('.lines.cost .lr select')){const p=prod(e.target.value),ci=e.target.parentElement.querySelectorAll('input')[1];if(p&&ci)ci.value=p.cost;return}const k=e.target.dataset.ch;if(!k)return;
  if(k==='posDispatch'){UI.posDispatch=e.target.checked;return}
  if(RO_CH.test(k)&&curLevel()!=='full'&&k!=='posCust'&&k!=='posDispatch'){toast('View only. Your role cannot change this.');render();return}
  if(k==='perm'){const r=S.roles.find(x=>x.id===UI.permRole);if(!r||r.locked)return;const mod=e.target.dataset.mod,tb=e.target.dataset.tab,val=e.target.value;if(tb){if(val)r.perms[mod].tabs[tb]=val;else delete r.perms[mod].tabs[tb]}else{r.perms[mod].level=val}audit(`Permissions for ${r.name}: ${MODS.find(x=>x.k===mod).n}${tb?' → '+tb:''} set to ${val?LV_LABEL[val]:'same as menu'}`,'settings');save();render();return}
  if(k==='logo'){if(e.target.files[0])readLogo(e.target.files[0]);e.target.value='';return}
  if(k==='profile'){if(e.target.files[0])importProfile(e.target.files[0]);e.target.value='';return}
  if(k==='brandColor'){S.settings.biz.color=e.target.value;save();renderBrand();toast('Brand colour saved.');return}
  if(k==='restore'){if(e.target.files[0])restoreFrom(e.target.files[0]);e.target.value='';return}
  if(k==='pFrom'||k==='pTo'){UI.pPreset='';if(!e.target.value)return}
  UI[k]=e.target.value;if(k==='posCust'){UI.posPhone='';UI.posDispatch=false;refreshCart();return}render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('modal').hidden)closeModal()});
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(MODS.some(m=>m.k===h)&&h!==UI.mod){UI.mod=h;render()}});

/* ============ Boot ============ */
(async function boot(){let firstRun=false;
  if(window.BIGWIZ_WEB&&!DESK)DL={save:async({filename,data})=>{const blob=data instanceof Blob?data:new Blob([data]);const u=URL.createObjectURL(blob);const el=document.createElement('a');el.href=u;el.download=filename;document.body.appendChild(el);el.click();setTimeout(()=>{URL.revokeObjectURL(u);el.remove()},1500);return{status:'saved'}}};
  if(DESK){DL={save:async({filename,data})=>{const r=await api('/api/export?name='+encodeURIComponent(filename),{method:'POST',body:data});return await r.json()}};
    try{const r=await api('/api/data');if(r.status===200){const d=await r.json();if(d&&d.ver===1&&d.accounts){S=d;migrate();buildAccts()}}}catch(e){}
    if(!S){firstRun=true;seed()}}
  else load();
  try{UI.uid=localStorage.getItem(KEY+'-user')||''}catch(e){}
  try{const u=JSON.parse(localStorage.getItem(KEY+'-ui')||'null');if(u){UI.mod=u.mod||UI.mod;UI.tab=u.tab||{}}}catch(e){}
  {const h=location.hash.slice(1);if(MODS.some(m=>m.k===h))UI.mod=h}
  render();
  if(firstRun){save();openModal('Welcome to Bigwiz',`<p style="margin-top:0">Bigwiz keeps its data in a file on this computer and saves every change automatically.</p><p>Explore the sample business first, or set up your own company with a clean ledger.</p><div class="mfoot"><button type="button" class="btn" data-act="closeModal">Explore the sample business</button><button type="button" class="btn primary" data-act="setupCompany">Set up my company</button></div>`)}
  try{if(!DESK&&window.claude&&window.claude.use)window.claude.use('downloads').then(d=>{if(d){DL=d;render()}},()=>{})}catch(e){}})();
</script>
</body></html>
